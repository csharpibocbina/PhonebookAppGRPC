# docker compose up --build
#   App:            http://localhost:3000
#   API docs:       http://localhost:8080/scalar   (also http://localhost:3000/scalar)
#   PaperCut inbox: http://localhost:37408
#   Native gRPC:    localhost:8081  (grpcurl -plaintext localhost:8081 list)
name: phonebook

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonebook}
      POSTGRES_USER: ${POSTGRES_USER:-phonebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonebook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server with a web inbox. Every email the API sends lands here.
  papercut:
    image: changemakerstudiosus/papercut-smtp:7.8
    ports:
      - "37408:8080" # web UI (SMTP listens on 2525 inside the network)

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Phonebook: Host=db;Port=5432;Database=${POSTGRES_DB:-phonebook};Username=${POSTGRES_USER:-phonebook};Password=${POSTGRES_PASSWORD:-phonebook}
      Database__Provider: Postgres
      Database__SeedDemoData: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (copy .env.example)}
      # Local http setup: Safari won't send Secure cookies over http://localhost.
      # Set to "true" when you serve the app over HTTPS.
      Jwt__RefreshCookieSecure: ${REFRESH_COOKIE_SECURE:-false}
      Smtp__Host: papercut
      Smtp__Port: "2525"
      Cors__Origins__0: http://localhost:5173
    ports:
      - "8080:8080" # gRPC-Web, REST, SignalR, Scalar
      - "8081:8081" # native gRPC (HTTP/2)
    depends_on:
      db:
        condition: service_healthy
      papercut:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
