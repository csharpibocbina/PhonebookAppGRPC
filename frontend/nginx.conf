# Serves the React app and proxies the backend on the SAME origin, so the
# httpOnly refresh-token cookie works and the browser needs no CORS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # gRPC-Web + REST: /api/phonebook.v1.PhonebookService/ListContacts -> api:8080/phonebook.v1...
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  # SignalR: needs the WebSocket upgrade headers.
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # API docs.
  location /scalar {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }
  location /swagger/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths go to index.html and React Router.
  location / {
    try_files $uri /index.html;
  }
}
